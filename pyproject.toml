[project]
name = "pehchaan"
version = "0.2.0"
description = "Every fact in an Indian phone-call transcript: right, or flagged."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]   # long data/regex lines are fine; keep functions short instead

[tool.ruff.lint.per-file-ignores]
"app/server.py" = ["B008"]   # FastAPI declares form/file parameters with File()/Form() defaults by design
