[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pehchaan"
version = "0.3.0"
description = "A verification layer for speech-to-text on Indian calls: fewer wrong facts slip through, and when unsure it asks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.60",
    "indic_transliteration>=2.3",
    "rapidfuzz>=3.0",
    "jiwer>=3.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.scripts]
pehchaan = "pehchaan_sdk.cli:main"

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=13", "python-multipart>=0.0.9", "httpx>=0.27"]

# The frozen engine finds its data relative to its own parent folder, so an installed copy carries that data beside it.
[tool.hatch.build.targets.wheel]
packages = ["pehchaan", "pehchaan_sdk", "bench"]

[tool.hatch.build.targets.wheel.force-include]
"config/settings.yaml" = "config/settings.yaml"
"data/languages" = "data/languages"
"data/lexicons" = "data/lexicons"
"data/meaning" = "data/meaning"
"data/bench/learning_corpus.jsonl" = "data/bench/learning_corpus.jsonl"
"data/bench/oracle_numbers.yaml" = "data/bench/oracle_numbers.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]   # long data/regex lines are fine; keep functions short instead

[tool.ruff.lint.per-file-ignores]
"app/server.py" = ["B008"]   # FastAPI declares form/file parameters with File()/Form() defaults by design
"app/v1.py" = ["B008"]
