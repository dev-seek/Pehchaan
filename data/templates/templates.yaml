# Call-line templates. {SLOTS} are filled by bench/generate.py with a spoken form (for the audio) and a
# written form (the ground truth). Because code fills both, labels are exact by construction.
# split: dev templates are used for tuning; test templates are NEVER looked at while tuning.
# lang: hi = Hindi in Devanagari (with English words), hl = Hinglish in Latin letters, en = Indian English,
#       te = Telugu. The REAL-VOICE test set uses only languages the recorder speaks (hi, hl, en): DECISIONS D-012.
# org_kinds: which brand kinds fit; amount_kind: realistic amount range (see generate.py AMOUNT_KINDS).
