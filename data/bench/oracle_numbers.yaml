names:
  threshold: 0.2          # max normalised weighted edit distance for "same name"
  min_denominator: 3      # floor for the consonant count that normalises the distance
  cost:
    schwa: 0.15           # a missing/extra inherent 'a'
    vowel: 0.3            # other vowel insertion/deletion, and vowel-vowel substitution
    abjad_vowel: 0.1      # vowel indel when either side is Perso-Arabic (short vowels unwritten)
    aspirate: 0.5         # h
    glide: 0.5            # y, v
    post_consonant_glide: 0.1   # బ్యాంక్ / bank: a y after a consonant is a loanword spelling
    nasal: 0.4            # n/m before a consonant (anusvara spelling variance)
    glide_vowel_sub: 0.5
    confusable: 0.3
    unrelated_consonant: 9.0   # a real consonant change is a different name, never a spelling variant
  confusable: ["s S"]
  vowel_classes: ["a", "e i", "o u"]   # first vowel must stay in its class (Karan is not Kiran)
  flag_credit_min_ratio: 0.55          # a flag counts for a fact only if its span resembles that fact
  window_extra: 3         # text windows may be this many tokens longer than the name
  # Ordered regex rules turning Latin spelling into the common phoneme alphabet.
  # Alphabet: vowels a e i o u; consonants k g C(ch) j t d n p f b m y r l v S(sh) s h
  latin_rules:
    - ["tch", "C"]
    - ["chh", "C"]
    - ["ch", "C"]
    - ["ksh", "kS"]
    - ["sh", "S"]
    - ["kh", "k"]
    - ["gh", "g"]
    - ["bh", "b"]
    - ["dh", "d"]
    - ["th", "t"]
    - ["ph", "f"]
    - ["jh", "j"]
    - ["zh", "j"]
    - ["ck", "k"]
    - ["x", "ks"]
    - ["q", "k"]
    - ["w", "v"]
    - ["z", "j"]
    - ["c(?=[eiy])", "s"]
    - ["c", "k"]
    - ["ee", "i"]
    - ["ii", "i"]
    - ["oo", "u"]
    - ["uu", "u"]
    - ["aa", "a"]
    - ["ai", "e"]
    - ["au", "o"]
    - ["ou", "o"]
    - ["ow", "o"]
    - ["(?<=[aeiou])h$", ""]
    - ["(?<=[^aeiou])y$", "i"]
  # spoken names of Latin letters, in the phoneme alphabet (for KR, HDFC, ...)
  letter_names: "a=e b=bi c=si d=di e=i f=ef g=ji h=eC i=ai j=je k=ke l=el m=em n=en o=o p=pi q=kiu r=ar s=es t=ti u=yu v=vi w=dabalyu x=eks y=vai z=jed"
  scripts:
    devanagari:
      range: [0x0900, 0x097F]
      final_schwa: false
      cons: "क=k ख=k ग=g घ=g ङ=n च=C छ=C ज=j झ=j ञ=n ट=t ठ=t ड=d ढ=d ण=n त=t थ=t द=d ध=d न=n प=p फ=f ब=b भ=b म=m य=y र=r ल=l व=v श=S ष=S स=s ह=h ळ=l ऩ=n ऱ=r"
      indep: "अ=a आ=a इ=i ई=i उ=u ऊ=u ऋ=ri ए=e ऐ=e ओ=o औ=o ऑ=o ऍ=e"
      signs: "ा=a ि=i ी=i ु=u ू=u ृ=ri े=e ै=e ो=o ौ=o ॉ=o ॅ=e"
      virama: "्"
      nasal: "ं ँ"
      visarga: "ः"
    telugu:
      range: [0x0C00, 0x0C7F]
      final_schwa: true
      final_anusvara_is_m: true
      cons: "క=k ఖ=k గ=g ఘ=g ఙ=n చ=C ఛ=C జ=j ఝ=j ఞ=n ట=t ఠ=t డ=d ఢ=d ణ=n త=t థ=t ద=d ధ=d న=n ప=p ఫ=f బ=b భ=b మ=m య=y ర=r ల=l వ=v శ=S ష=S స=s హ=h ళ=l ఱ=r"
      indep: "అ=a ఆ=a ఇ=i ఈ=i ఉ=u ఊ=u ఋ=r ఎ=e ఏ=e ఐ=e ఒ=o ఓ=o ఔ=o"
      signs: "ా=a ి=i ీ=i ు=u ూ=u ృ=r ె=e ే=e ై=e ొ=o ో=o ౌ=o"
      virama: "్"
