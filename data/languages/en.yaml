# English language pack (Indian English). Includes English number words as Indian ASR writes them in
# Devanagari and Telugu script ("नाइन एट फोर" = nine eight four): confirmed in gpt-transcribe output on 21 Nov.
code: en
name: English
scripts: [latin]

numbers:
  words:
    0: [zero, oh, ज़ीरो, जीरो, ज़ेरो, జీరో]
    1: [one, वन, వన్]
    2: [two, टू, టూ]
    3: [three, थ्री, త్రీ]
    4: [four, फोर, फ़ोर, ఫోర్]
    5: [five, फाइव, फ़ाइव, ఫైవ్]
    6: [six, सिक्स, సిక్స్]
    7: [seven, सेवन, సెవెన్]
    8: [eight, एट, एइट, ఎయిట్, ఎయిత్]
    9: [nine, नाइन, నైన్]
    10: [ten, टेन, టెన్]
    11: [eleven, इलेवन, ఎలెవెన్]
    12: [twelve, ट्वेल्व, ట్వెల్వ్]
    13: [thirteen, थर्टीन, థర్టీన్]
    14: [fourteen, फोर्टीन, ఫోర్టీన్]
    15: [fifteen, फिफ्टीन, ఫిఫ్టీన్]
    16: [sixteen, सिक्सटीन, సిక్స్టీన్]
    17: [seventeen, सेवनटीन, సెవెంటీన్]
    18: [eighteen, एटीन, ఎయిటీన్]
    19: [nineteen, नाइनटीन, నైన్టీన్]
    20: [twenty, ट्वेंटी, ట్వెంటీ]
    30: [thirty, थर्टी, థర్టీ]
    40: [forty, fourty, फोर्टी, ఫోర్టీ]
    50: [fifty, फिफ्टी, ఫిఫ్టీ]
    60: [sixty, सिक्सटी, సిక్స్టీ]
    70: [seventy, सेवेंटी, సెవెంటీ]
    80: [eighty, एटी, ఎయిటీ]
    90: [ninety, नाइंटी, నైంటీ]
  multipliers:
    100: [hundred, hundreds, हंड्रेड, హండ్రెడ్]
    1000: [thousand, thousands, k, थाउज़ेंड, थाउजेंड, థౌజండ్]
    100000: [lakh, lakhs, lac, lacs]
    10000000: [crore, crores]
  fractions: {}
  shift_modifiers: {}
  repeaters:
    2: [double, dubbal, डबल, డబుల్]
    3: [triple, tripple, ट्रिपल, ట్రిపుల్]
  weak: [oh, k, too, van]
  teen_ty_pairs: [[thirteen, thirty], [fourteen, forty], [fifteen, fifty], [sixteen, sixty], [seventeen, seventy],
    [eighteen, eighty], [nineteen, ninety]]

cues:
  PHONE: [number, mobile, phone, fone, contact, whatsapp, call, callback, dial]
  PIN: [pin, pincode, postal, zip]
  AMOUNT: [rs, rupees, rupee, inr, emi, amount, payment, pay, balance, due, bill, fees, fee, charges, premium, rent,
    refund, loan, transaction, price, cost, outstanding]
  CURRENCY: [rupees, rupee, rs, inr]

