  he, she, him, her, his, them, there, here, what, when, where, why, how, who, will, can, could, would, should, do,
  does, did, have, has, had, get, got, go, going, come, coming, send, sent, check, call, phone, number, mobile,
  message, sms, otp, order, delivery, parcel, courier, payment, pay, paid, amount, emi, loan, bank, card, account,
  balance, refund, bill, due, date, time, location, address, pin, code, branch, office, customer, care, service,
