letter_names:     # how English letters are spelled out in Indian scripts (एचडीएफसी = H-D-F-C), after romanisation
  a: [e, ae]
  b: [bee, bi]
  c: [see, si]
  d: [dee, di]
  e: [ee, i]
  f: [epha, eph, ef]
  g: [jee, ji]
  h: [echa, ech, hech, ecch]
  i: [aaee, aai, ai]
  j: [je, jay]
  k: [ke, kay]
  l: [ela, el]
  m: [ema, em]
  n: [ena, en]
  o: [o]
  p: [pee, pi]
  q: [kyoo, kyu]
  r: [aara, aar, ar]
  s: [esa, es]
  t: [tee, ti]
  u: [yoo, yu]
  v: [vee, vi]
  w: [dablyoo, dabalyoo]
  x: [eksa, eks]
  y: [vaaee, vaai, vai]
  z: [jeda, zed, jed]

markers:          # where a word sits decides what it can be (policy/gate.py)
  origin_after: []
  origin_before: [from]                      # "from Delhivery": the next word names who is calling
  place_after: [side, area]
  cue_filler: [is, was, are, code]

fact_cues:        # words that announce a number is coming; if none follows, we ask
  PHONE: [number]
  PIN: [pin, pincode]

clarify:
  PERSON: {two: "{a} or {b}?", one: "Just confirming, this is {a}?", none: "Could you repeat your name once?"}
  ORG: {two: "{a} or {b}?", one: "You're calling from {a}, right?", none: "Which company are you calling from?"}
  PLACE: {two: "{a} or {b}?", one: "The location is {a}, right?", none: "Could you repeat the location?"}
  PHONE: {one: "Let me confirm the number: {a}?", none: "Could you repeat the number slowly?"}
  PIN: {one: "Is the pin code {a}?", none: "Could you repeat the pin code?"}
  AMOUNT: {one: "Is the amount {a}?", none: "Could you repeat the amount?"}

