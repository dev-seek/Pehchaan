glue_words: [from, of, the, a, an, at, in, to, near, for, with, and, or, by, on, sir, madam, mam]

letter_names:     # how English letters are spelled out in Indian scripts (एचडीएफसी = H-D-F-C), after romanisation
  a: [e, ae]
  b: [bee, bi]
  c: [see, si]
  d: [dee, di]
  e: [ee, i]
  f: [epha, eph, ef]
  g: [jee, ji]
  h: [echa, ech, hech, ecch]
  i: [aaee, aai, ai]
  j: [je, jay]
  k: [ke, kay]
  l: [ela, el]
  m: [ema, em]
  n: [ena, en]
  o: [o]
  p: [pee, pi]
  q: [kyoo, kyu]
  r: [aara, aar, ar]
  s: [esa, es]
  t: [tee, ti]
  u: [yoo, yu]
  v: [vee, vi]
  w: [dablyoo, dabalyoo]
  x: [eksa, eks]
  y: [vaaee, vaai, vai]
  z: [jeda, zed, jed]

clarify:
  PERSON: {two: "Sorry, is your name {a} or {b}?", one: "Just confirming, this is {a}?", none: "Could you repeat your name once?"}
  ORG: {two: "Are you calling from {a} or {b}?", one: "You're calling from {a}, right?", none: "Which company are you calling from?"}
  PLACE: {two: "Is the location {a} or {b}?", one: "The location is {a}, right?", none: "Could you repeat the location?"}
  PHONE: {one: "Let me confirm the number: {a}?", none: "Could you repeat the number slowly?"}
  PIN: {one: "Is the pin code {a}?", none: "Could you repeat the pin code?"}
  AMOUNT: {one: "Is the amount {a}?", none: "Could you repeat the amount?"}
