# English language pack (Indian English). Includes English number words as Indian ASR writes them in
# Devanagari and Telugu script ("नाइन एट फोर" = nine eight four): confirmed in gpt-transcribe output on 21 Nov.
code: en
name: English
scripts: [latin]

numbers:
  words:
    0: [zero, oh, ज़ीरो, जीरो, ज़ेरो, జీరో]
    1: [one, वन, వన్]
    2: [two, टू, టూ]
    3: [three, थ्री, త్రీ, थ्रि]
    4: [four, फोर, फ़ोर, ఫోర్]
    5: [five, फाइव, फ़ाइव, ఫైవ్, फाईव]
    6: [six, सिक्स, సిక్స్]
    7: [seven, सेवन, సెవెన్, सेवेन]
    8: [eight, एट, एइट, ఎయిట్, ఎయిత్]
    9: [nine, नाइन, నైన్, नाईन]
    10: [ten, टेन, టెన్]
    11: [eleven, इलेवन, ఎలెవెన్, इलेवेन]
    12: [twelve, ट्वेल्व, ట్వెల్వ్]
    13: [thirteen, थर्टीन, థర్టీన్, थर्टिन]
    14: [fourteen, फोर्टीन, ఫోర్టీన్, फोरटीन]
    15: [fifteen, फिफ्टीन, ఫిఫ్టీన్, फिफटीन]
    16: [sixteen, सिक्सटीन, సిక్స్టీన్, सिक्सटिन]
    17: [seventeen, सेवनटीन, సెవెంటీన్, सेवेंटीन]
    18: [eighteen, एटीन, ఎయిటీన్, एइटीन]
    19: [nineteen, नाइनटीन, నైన్టీన్, नाइंटीन]
    20: [twenty, ट्वेंटी, ట్వెంటీ, ट्वेन्टी]
    30: [thirty, थर्टी, థర్టీ]
    40: [forty, fourty, फोर्टी, ఫోర్టీ]
    50: [fifty, फिफ्टी, ఫిఫ్టీ, फिफटी]
    60: [sixty, सिक्सटी, సిక్స్టీ, सिक्स्टी]
    70: [seventy, सेवेंटी, సెవెంటీ, सेवेन्टी]
    80: [eighty, एटी, ఎయిటీ, एइटी]
    90: [ninety, नाइंटी, నైంటీ, नाइनटी]
  multipliers:
    100: [hundred, hundreds, हंड्रेड, హండ్రెడ్, हन्ड्रेड]
    1000: [thousand, thousands, k, थाउज़ेंड, थाउजेंड, థౌజండ్, థౌజెండ్, थाउज़ंड, थाउजंड]
    100000: [lakh, lakhs, lac, lacs, लैक]
    10000000: [crore, crores, क्रोर, क्रोड़, cr]
  fractions: {}
  shift_modifiers: {}
  repeaters:
    2: [double, dubbal, डबल, డబుల్]
    3: [triple, tripple, ट्रिपल, ట్రిపుల్, ट्रीपल]
  weak: [oh, k, too, van]
  teen_ty_pairs: [[thirteen, thirty], [fourteen, forty], [fifteen, fifty], [sixteen, sixty], [seventeen, seventy],
    [eighteen, eighty], [nineteen, ninety]]

