# Hindi language pack. Native script and the romanised spellings people (and ASR) actually produce.
# Every word here is normalised by the loader, so write words exactly as they appear in transcripts.
# To add a language: copy this file, translate the sections, add its code to settings.yaml languages.active.
code: hi
name: Hindi
scripts: [devanagari]

