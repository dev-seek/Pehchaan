clarify:          # one short question per unresolved fact; {a}/{b} = top candidates, {heard} = what we heard
  PERSON: {two: "Maaf kijiye, aapka naam {a} hai ya {b}?", one: "Ek baar confirm kar dijiye, aap {a} bol rahe hain?", none: "Aapka naam ek baar dobara bata dijiye?"}
