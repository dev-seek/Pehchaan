markers:          # where a word sits decides what it can be (policy/gate.py)
  origin_after: [से, se]                     # "Delhivery se": the word before it names who is calling
  origin_before: []
  place_after: [वाला, वाले, वाली, wala, wale, wali, vala, vale, vali]   # "Narayanguda wale flat": a place
  cue_filler: [है, हैं, था, थी, hai, hain, tha, thi, कोड, code]   # may follow "number"/"pin" with no digits yet

fact_cues:        # words that announce a number is coming; if none follows, we ask
  PHONE: [नंबर, नम्बर, numbar, nambar]
  PIN: [पिन, पिनकोड, pinkod]

clarify:          # one short question per unresolved fact; {a}/{b} = top candidates, {heard} = what we heard
  PERSON: {two: "{a} ya {b}?", one: "Ek baar confirm kar dijiye, aap {a} bol rahe hain?", none: "Aapka naam ek baar dobara bata dijiye?"}
  ORG: {two: "{a} ya {b}?", one: "Aap {a} se bol rahe hain na?", none: "Kis company se bol rahe hain?"}
  PLACE: {two: "{a} ya {b}?", one: "Location {a} hi hai na?", none: "Location ek baar dobara bata dijiye?"}
  PHONE: {one: "Number ek baar confirm kar dijiye, {a}?", none: "Number ek baar dhire se dobara bata dijiye?"}
  PIN: {one: "Pin code {a} hai na?", none: "Pin code ek baar dobara bata dijiye?"}
  AMOUNT: {one: "Amount {a} hai na?", none: "Amount ek baar dobara bata dijiye?"}

